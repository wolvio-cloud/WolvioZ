services:
  # ─── Redis (LiteLLM cache + rate limiting store) ─────────────────────────
  redis:
    image: redis:7.4-alpine                        # Pinned minor version
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # Password set via env var; cache-only (no persistence needed)
    command: >
      sh -c "redis-server
      --requirepass $$REDIS_PASSWORD
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ''
      --appendonly no
      --loglevel warning"
    volumes:
      - redis_data:/data
    networks:
      - wolvio
    healthcheck:
      # NOAUTH = server running but auth required (expected); PONG = no-auth mode
      test: ["CMD-SHELL", "redis-cli ping 2>&1 | grep -qE 'PONG|NOAUTH'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 320M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ─── LiteLLM (multi-provider AI gateway) ────────────────────────────────
  litellm:
    # Pinned to latest stable release — update deliberately, not automatically
    image: ghcr.io/berriai/litellm:v1.82.3-stable
    restart: unless-stopped
    # Port 4000 is NOT published to the host — only reachable inside the wolvio network
    expose:
      - "4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # NOTE: multi-worker mode (--num_workers N) requires a shared Postgres/Redis DB
    # for state coordination; without it workers crash immediately on startup.
    # Single-worker is stable and sufficient for this deployment size.
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - wolvio
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ─── SearXNG (self-hosted search engine for web search) ─────────────────
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    # Not published to host — internal only, accessed by Open WebUI
    expose:
      - "8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: "http://searxng:8080/"
      # Secret key — set SEARXNG_SECRET_KEY in .env; overrides the placeholder in settings.yml
      SEARXNG_SECRET: ${SEARXNG_SECRET_KEY}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - wolvio
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Open WebUI (chat interface) ─────────────────────────────────────────
  open-webui:
    # Pinned to latest stable release — update deliberately, not automatically
    image: ghcr.io/open-webui/open-webui:v0.8.10
    restart: unless-stopped
    # Port 8080 is NOT published to the host — Caddy proxies to it internally
    expose:
      - "8080"
    volumes:
      - open_webui_data:/app/backend/data
    environment:
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      ENABLE_OLLAMA_API: "false"
      # Admin creates all accounts — public self-registration is disabled
      WEBUI_AUTH: "true"
      ENABLE_SIGNUP: "false"
      # SearXNG — self-hosted search, used when web search is enabled in a chat
      SEARXNG_QUERY_URL: "http://searxng:8080/search?q=<query>&format=json"
    depends_on:
      litellm:
        condition: service_healthy
      searxng:
        condition: service_healthy
    networks:
      - wolvio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    # (built-in HEALTHCHECK also present in the image — explicit one above takes precedence)
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ─── Caddy (TLS termination + reverse proxy) ─────────────────────────────
  caddy:
    image: caddy:2.9-alpine                        # Pinned minor version
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"                              # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      open-webui:
        condition: service_healthy
    networks:
      - wolvio
    healthcheck:
      # Caddy admin API (localhost-only by design) confirms the process is alive
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  redis_data:
  open_webui_data:
  caddy_data:
  caddy_config:

networks:
  wolvio:
    driver: bridge
