services:
  # ─── Redis ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - wolvio

  # ─── LiteLLM ────────────────────────────────────────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    # Port 4000 is NOT exposed to host — only Caddy can reach it internally
    expose:
      - "4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    depends_on:
      - redis
    networks:
      - wolvio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health/liveliness"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  # ─── Open WebUI ─────────────────────────────────────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    # Not exposed to host — Caddy proxies traffic to it
    expose:
      - "8080"
    volumes:
      - open_webui_data:/app/backend/data
    environment:
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      ENABLE_OLLAMA_API: "false"
      # Disable public signup — admin creates accounts manually
      WEBUI_AUTH: "true"
    depends_on:
      litellm:
        condition: service_healthy
    networks:
      - wolvio

  # ─── Caddy (HTTPS reverse proxy) ────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SERVER_IP: ${SERVER_IP:-159.65.153.81}
    depends_on:
      - open-webui
      - litellm
    networks:
      - wolvio

volumes:
  redis_data:
  open_webui_data:
  caddy_data:
  caddy_config:

networks:
  wolvio:
    driver: bridge
