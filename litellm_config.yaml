# LiteLLM Proxy Configuration
# Reference: https://docs.litellm.ai/docs/proxy/configs

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Cap total concurrent requests to protect upstream provider rate limits
  max_parallel_requests: 100

router_settings:
  routing_strategy: least-busy
  num_retries: 3
  timeout: 90
  # Provider fallbacks: if primary fails, automatically route to secondary
  fallbacks:
    - {"gpt-4o": ["gpt-4o-mini"]}
    - {"claude-3-5-sonnet": ["claude-3-haiku"]}
    - {"gemini-2.0-flash": ["gemini-1.5-pro"]}
    - {"llama-3.3-70b": ["llama-3.1-8b"]}

litellm_settings:
  drop_params: true
  set_verbose: false
  telemetry: false                               # Do not send usage data to BerriAI
  request_timeout: 90
  # Redis-backed response cache — identical requests within the TTL window
  # are served from cache, cutting provider cost and latency significantly
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    password: os.environ/REDIS_PASSWORD
    ttl: 600                                     # 10-minute cache window

# ─── Models ─────────────────────────────────────────────────────────────────
model_list:

  # ── OpenAI ──────────────────────────────────────────────────────────────
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # ── Anthropic ────────────────────────────────────────────────────────────
  - model_name: claude-3-5-sonnet
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-3-haiku
    litellm_params:
      model: anthropic/claude-3-haiku-20240307
      api_key: os.environ/ANTHROPIC_API_KEY

  # ── Google Gemini ────────────────────────────────────────────────────────
  - model_name: gemini-2.0-flash
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-1.5-pro
    litellm_params:
      model: gemini/gemini-1.5-pro
      api_key: os.environ/GEMINI_API_KEY

  # ── Groq (fast inference) ────────────────────────────────────────────────
  - model_name: llama-3.3-70b
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY

  - model_name: llama-3.1-8b
    litellm_params:
      model: groq/llama-3.1-8b-instant
      api_key: os.environ/GROQ_API_KEY

  - model_name: mixtral-8x7b
    litellm_params:
      model: groq/mixtral-8x7b-32768
      api_key: os.environ/GROQ_API_KEY
