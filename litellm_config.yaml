# LiteLLM Proxy Configuration
# Reference: https://docs.litellm.ai/docs/proxy/configs

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Cap total concurrent requests to protect upstream provider rate limits
  max_parallel_requests: 100

router_settings:
  routing_strategy: least-busy
  num_retries: 3
  timeout: 180                                       # Extended — Opus 4 takes longer for deep reasoning
  # Provider fallbacks: if primary fails, automatically route to secondary
  fallbacks:
    - {"gpt-4o": ["gpt-4o-mini"]}
    - {"claude-opus-4": ["claude-sonnet-4"]}
    - {"claude-sonnet-4": ["claude-haiku-4"]}
    - {"claude-3-5-sonnet": ["claude-3-haiku"]}
    - {"gemini-2.5-flash": ["gemini-2.0-flash-lite"]}
    - {"llama-3.3-70b": ["llama-3.1-8b"]}

litellm_settings:
  drop_params: true
  set_verbose: false
  # Redis-backed response cache — LiteLLM reads REDIS_URL env var for connection
  # (includes auth password already embedded in the URL)
  cache: true
  cache_params:
    type: redis
    ttl: 600                                     # 10-minute cache window

# ─── Models ─────────────────────────────────────────────────────────────────
model_list:

  # ── OpenAI ──────────────────────────────────────────────────────────────
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # ── Anthropic ────────────────────────────────────────────────────────────
  # Claude 4 — current generation (2025)
  - model_name: claude-opus-4                        # Best reasoning — use for deep analysis
    litellm_params:
      model: anthropic/claude-opus-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-sonnet-4                      # Balanced — fast + smart
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-haiku-4                       # Fastest Claude — quick tasks
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  # Claude 3.5 — previous generation (kept for compatibility)
  - model_name: claude-3-5-sonnet
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-3-haiku
    litellm_params:
      model: anthropic/claude-3-haiku-20240307
      api_key: os.environ/ANTHROPIC_API_KEY

  # ── Google Gemini ────────────────────────────────────────────────────────
  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash-preview-04-17
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-2.0-flash-lite
    litellm_params:
      model: gemini/gemini-2.0-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  # ── Groq (fast inference) ────────────────────────────────────────────────
  - model_name: llama-3.3-70b
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY

  - model_name: llama-3.1-8b
    litellm_params:
      model: groq/llama-3.1-8b-instant
      api_key: os.environ/GROQ_API_KEY

  - model_name: qwen3-32b
    litellm_params:
      model: groq/qwen/qwen3-32b
      api_key: os.environ/GROQ_API_KEY
